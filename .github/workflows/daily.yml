name: Daily data archive

on:
  schedule:
    # 04:00 and 16:00 UTC = 09:30 and 21:30 IST (UTC+5:30) — morning + evening.
    # The backup run keeps the streak alive if the first one fails.
    # GitHub's cron can be delayed 15 min–2 h under load — that's normal.
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  # Lets you trigger a run manually from the Actions tab.
  workflow_dispatch:

# Allow the workflow to push commits and open an issue on failure.
permissions:
  contents: write
  issues: write

# Never let two runs push at once.
concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily update
        env:
          # Optional: add a free NASA key as a repo secret to avoid rate limits.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python daily_update.py

      - name: Commit and push
        env:
          # These default to your values below. To change them without editing
          # this file, set repo variables GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL
          # (Settings -> Secrets and variables -> Actions -> Variables).
          AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'Oumar Tamba Tirera' }}
          AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'oumartambatirera@gmail.com' }}
        run: |
          # Commit AS YOU so it counts toward your contribution graph.
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily archive: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily archive failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `The scheduled **Daily data archive** run failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Trigger: \`${context.eventName}\``,
              ``,
              `A single failed run does not break the streak on its own — the backup run may still succeed. Check the log above.`,
            ].join("\n");
            // Avoid duplicate open issues for the same failure.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "archive-failure",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["archive-failure"],
              });
            }
